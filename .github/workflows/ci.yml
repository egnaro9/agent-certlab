name: calibration
on: [push, pull_request]
jobs:
  wedge-calibration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # bundle stamps use the last code-touching commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - name: the wedge must separate known-bad from known-good
        run: python -m pytest tests/ -q
      - name: every committed certification must regrade consistent
        run: python -m certlab.regrade
      - name: COMPARISON.md must be a fresh compile of the committed bundles
        run: python -m certlab.compare && git diff --exit-code COMPARISON.md
      - name: every certification must verify as a VAC bundle
        # Hard requirement: vac-protocol is public, so a failed install is a
        # failed build — a silently-inert guard here would let a network
        # hiccup skip the check while reading as green.
        run: |
          pip install "git+https://github.com/egnaro9/vac-protocol"
          for d in certifications/*/; do python -m vac.verify "$d"; done
