name: calibration
on: [push, pull_request]
jobs:
  wedge-calibration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # bundle stamps use the last code-touching commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - name: the wedge must separate known-bad from known-good
        run: python -m pytest tests/ -q
      - name: every committed certification must regrade consistent
        run: python -m certlab.regrade
      - name: COMPARISON.md must be a fresh compile of the committed bundles
        run: python -m certlab.compare && git diff --exit-code COMPARISON.md
      - name: every certification must verify as a VAC bundle
        # Inert until github.com/egnaro9/vac-protocol is public: the guarded
        # pip install is the activation switch — on the first public push of
        # vac-protocol it starts succeeding, and from then on any structural
        # verification failure fails the build (deliberately NOT
        # continue-on-error; the guard is the install, never the verdict).
        run: |
          if pip install "git+https://github.com/egnaro9/vac-protocol"; then
            for d in certifications/*/; do python -m vac.verify "$d"; done
          else
            echo "vac-protocol not public yet — VAC verification inert"
          fi
